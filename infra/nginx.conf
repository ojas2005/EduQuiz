events { worker_connections 1024; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  upstream api_pool {
    least_conn;
    server api1:8000 max_fails=3 fail_timeout=15s;
    server api2:8000 max_fails=3 fail_timeout=15s;
  }
  upstream web { server frontend:80; }
  server {
    listen 80;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    limit_req_status 429;
    location /api/auth/ {
      limit_req zone=auth burst=15 nodelay;
      proxy_pass http://api_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/chats/import {
      client_max_body_size 512k;
      limit_req zone=general burst=30 nodelay;
      proxy_pass http://api_pool;
      proxy_set_header Host $host;
    }
    location /api/ {
      limit_req zone=general burst=30 nodelay;
      proxy_read_timeout 120s;
      proxy_pass http://api_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { proxy_pass http://web; }
  }
}
